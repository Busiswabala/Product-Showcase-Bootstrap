<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact Us — Miss B Radiant Beauty</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"
    />
  </head>
  <body class="d-flex flex-column min-vh-100 bg-light">
    <!-- NAVBAR -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark px-3">
      <div class="container-fluid">
        <a class="navbar-brand fw-bold fs-5" href="index.html">
          Miss B Radiant Beauty</a
        >
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navMenu"
          aria-controls="navMenu"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navMenu">
          <ul class="navbar-nav ms-auto gap-1">
            <li class="nav-item">
              <a class="nav-link" href="index.html">Home</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="products.html">Products</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="about.html">About</a>
            </li>
            <li class="nav-item">
              <a class="nav-link active" href="contact.html">Contact</a>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <!-- PAGE HEADER -->
    <div class="bg-dark text-white text-center py-4">
      <h1 class="fw-bold mb-1 animate__animated animate__fadeInDown">
        Contact Us
      </h1>
      <p class="text-white-50 mb-0">We'd love to hear from you 💌</p>
    </div>

    <!-- CONTACT FORM -->
    <div class="container my-5">
      <div class="row justify-content-center">
        <div class="col-md-7 col-lg-6">
          <!-- Info alert -->
          <div
            class="alert alert-info d-flex align-items-center gap-2 mb-4"
            role="alert"
          >
            <span>📬</span>
            <span
              >Fill in the form below and we'll get back to you within 24
              hours!</span
            >
          </div>

          <!-- Form card -->
          <div class="card shadow-sm border-0 rounded-4">
            <div class="card-body p-4">
              <form>
                <div class="mb-3">
                  <label for="name" class="form-label fw-semibold"
                    >Your Full Name</label
                  >
                  <input
                    type="text"
                    class="form-control"
                    id="name"
                    placeholder="e.g. Busiswa Bala"
                  />
                </div>
                <div class="mb-3">
                  <label for="email" class="form-label fw-semibold"
                    >Your Email Address</label
                  >
                  <input
                    type="email"
                    class="form-control"
                    id="email"
                    placeholder="balabusiswa22@example.com"
                  />
                </div>
                <div class="mb-4">
                  <label for="message" class="form-label fw-semibold"
                    >Your Message</label
                  >
                  <textarea
                    class="form-control"
                    id="message"
                    rows="5"
                    placeholder="Write your message here..."
                  ></textarea>
                </div>
                <div class="d-grid">
                  <button
                    type="submit"
                    class="btn btn-danger rounded-pill fw-semibold py-2"
                  >
                    Send Message
                  </button>
                </div>
              </form>
            </div>
          </div>

          <!-- Contact details -->
          <div class="row text-center mt-4 g-3">
            <div class="col-4">
              <div class="bg-white rounded-3 shadow-sm p-3">
                <div class="fs-4">📍</div>
                <small class="text-muted fw-semibold">Durban, SA</small>
              </div>
            </div>
            <div class="col-4">
              <div class="bg-white rounded-3 shadow-sm p-3">
                <div class="fs-4">📱</div>
                <small class="text-muted fw-semibold">WhatsApp Orders</small>
              </div>
            </div>
            <div class="col-4">
              <div class="bg-white rounded-3 shadow-sm p-3">
                <div class="fs-4">🕐</div>
                <small class="text-muted fw-semibold">Mon–Sat 9–6pm</small>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- FOOTER -->
    <footer class="bg-dark text-white text-center py-3 mt-auto">
      <small
        >© 2026 <strong>Miss B Radiant Beauty</strong>. All rights reserved.
      </small>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
